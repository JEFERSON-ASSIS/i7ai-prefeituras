worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 52m;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Resolve recreated backend containers without retaining an old container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 8080;
        # Atrás do Traefik: redirecionar só com o caminho. Sem isso o nginx monta
        # http://host:8080/i7ai/ (porta interna) e o navegador não chega.
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/i7ai/api(?:/|$) {
            set $backend_origin http://i7ai-backend:3000;
            # Strip the /i7ai public prefix; the backend serves /api/*.
            rewrite ^/i7ai(/api.*)$ $1 break;
            proxy_pass $backend_origin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }

        location ^~ /i7ai/assets/ {
            alias /usr/share/nginx/html/assets/;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location = /i7ai {
            return 301 /i7ai/;
        }

        location = /i7ai/index.html {
            alias /usr/share/nginx/html/index.html;
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location /i7ai/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /i7ai/index.html;
        }

        location / {
            return 404;
        }
    }
}
