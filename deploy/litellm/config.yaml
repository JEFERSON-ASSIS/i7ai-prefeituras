# LiteLLM Proxy do i7Ai. O backend usa o contrato OpenAI /v1/chat/completions.
# Cada model_name deve ser igual ao slug cadastrado em Modelos no i7Ai e usar
# um prefixo liberado em OMNIROUTER_ALLOWED_PREFIXES (openai, anthropic, gemini, xai).
# As chaves dos provedores são cadastradas pelo SUPER_ADMIN no i7Ai (Provedores de IA)
# e guardadas criptografadas no banco do LiteLLM (LITELLM_SALT_KEY).

model_list:
  # Padrão barato para conversa geral, resumos e planilhas.
  - model_name: openai/gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      litellm_credential_name: openai

  # Claude rápido e barato.
  - model_name: anthropic/claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      litellm_credential_name: anthropic

  # Claude para documentos longos e análise (licitações, ETP, TR, edital).
  - model_name: anthropic/claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      litellm_credential_name: anthropic

  # Curingas por provedor: qualquer modelo do catálogo do i7Ai com estes prefixos
  # (ex.: openai/gpt-5.5, anthropic/claude-opus-5-5) segue para o provedor com a
  # chave cadastrada. Os modelos explícitos acima têm prioridade.
  - model_name: openai/*
    litellm_params:
      model: openai/*
      litellm_credential_name: openai

  - model_name: anthropic/*
    litellm_params:
      model: anthropic/*
      litellm_credential_name: anthropic

  - model_name: gemini/*
    litellm_params:
      model: gemini/*
      litellm_credential_name: gemini

  # Exemplo: descomente se tiver chave do Google AI Studio.
  # - model_name: gemini/gemini-2.5-flash
  #   litellm_params:
  #     model: gemini/gemini-2.5-flash
  #     litellm_credential_name: gemini

litellm_settings:
  # Remove parâmetros que um provedor não aceita, em vez de falhar a chamada.
  drop_params: true
  request_timeout: 300
  num_retries: 2
  # Sem fallbacks entre modelos: o i7Ai registra custo e provedor pelo modelo
  # escolhido. Ative só depois que o backend conferir o modelo da resposta.

  # Cache exato de respostas no Redis próprio do i7Ai (nunca o Redis do SGDM).
  # "default_off": nada é cacheado sem pedido. O backend pede por requisição,
  # só sem stream, com namespace "i7ai:<prefeitura>" para que uma prefeitura
  # nunca receba a resposta guardada de outra. O TTL vem da Central de IA.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    namespace: litellm.exact
    ttl: 3600
    mode: default_off
    supported_call_types: [acompletion, completion]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
